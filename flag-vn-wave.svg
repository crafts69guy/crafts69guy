<?xml version="1.0" encoding="utf-8"?>
<!-- assets/flag-vn-wave.svg
     Simplified animated Vietnam flag (single SVG filter + SMIL animate).
     Save at assets/flag-vn-wave.svg and embed from raw.githubusercontent.com.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 300 200"
     width="360" height="240"
     role="img" aria-label="Việt Nam flag waving">
  <defs>
    <!-- Generate turbulence (noise) and animate its frequency for motion -->
    <filter id="wave" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise"
                    baseFrequency="0.012 0.02"
                    numOctaves="2"
                    seed="4"
                    result="turb"/>
      <feGaussianBlur in="turb" stdDeviation="0.6" result="turbBlur"/>
      <feDisplacementMap in="SourceGraphic" in2="turbBlur"
                         scale="10" xChannelSelector="R" yChannelSelector="G"/>
      <!-- animate the turbulence to create continuous wave motion -->
      <feTurbulence baseFrequency="0.012 0.02" numOctaves="2" seed="5" result="turbAnim">
        <animate attributeName="baseFrequency"
                 dur="6s"
                 values="0.01 0.02;0.02 0.015;0.012 0.03;0.01 0.02"
                 repeatCount="indefinite"/>
      </feTurbulence>
    </filter>
  </defs>

  <!-- Background and star grouped so the filter displaces both -->
  <g filter="url(#wave)">
    <rect width="300" height="200" fill="#da251d"/>

    <!-- Five-point star centered on the flag. Coordinates sized for clarity. -->
    <g transform="translate(150,100) scale(0.9)">
      <polygon points="0,-45 13.7,-14 47,-14 20.9,6.1 30,44 0,22 -30,44 -20.9,6.1 -47,-14 -13.7,-14"
               fill="#ffde00" />
    </g>
  </g>
</svg>
