<?xml version="1.0" encoding="utf-8"?>
<!-- Vietnam flag with CSS animation wave effect -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 300 200"
     width="360" height="240"
     role="img" aria-label="Việt Nam flag waving">
  <style>
    @keyframes wave {
      0%, 100% {
        transform: perspective(300px) rotateY(0deg) skewY(0deg);
      }
      25% {
        transform: perspective(300px) rotateY(3deg) skewY(1deg);
      }
      50% {
        transform: perspective(300px) rotateY(0deg) skewY(-0.5deg);
      }
      75% {
        transform: perspective(300px) rotateY(-2deg) skewY(0.5deg);
      }
    }

    @keyframes shadowWave {
      0%, 100% { opacity: 0.1; }
      50% { opacity: 0.25; }
    }

    .flag-group {
      animation: wave 3s ease-in-out infinite;
      transform-origin: left center;
    }

    .shadow {
      animation: shadowWave 3s ease-in-out infinite;
    }
  </style>

  <defs>
    <linearGradient id="foldShade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="30%" stop-color="#000" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="70%" stop-color="#000" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <g class="flag-group">
    <!-- Red background -->
    <rect width="300" height="200" fill="#da251d"/>

    <!-- Five-point yellow star -->
    <g transform="translate(150,100)">
      <polygon points="0,-54 16.7,-17.5 56.5,-17.5 25,-7 36,45 0,22 -36,45 -25,-7 -56.5,-17.5 -16.7,-17.5"
               fill="#ffcd00"/>
    </g>

    <!-- Shading overlay for 3D fold effect -->
    <rect class="shadow" width="300" height="200" fill="url(#foldShade)"/>
  </g>
</svg>
